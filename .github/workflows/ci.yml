name: Static checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Validate Python backend
        run: python -m py_compile api/index.py
      - name: Validate browser JavaScript
        run: node --check api/static/app.js
      - name: Validate Rust core
        run: cargo check --manifest-path rust-core/Cargo.toml --target wasm32-unknown-unknown
