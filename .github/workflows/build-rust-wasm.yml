name: Build Rust WebAssembly

on:
  push:
    branches: [main]
    paths:
      - "rust-core/**"
      - ".github/workflows/build-rust-wasm.yml"

permissions:
  contents: write

jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Build browser module
        run: wasm-pack build rust-core --target web --release --out-dir ../api/static/wasm --out-name fileshare_core
      - name: Commit generated WebAssembly
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f api/static/wasm
          if ! git diff --cached --quiet; then
            git commit -m "build: compile Rust transfer core to WebAssembly"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
